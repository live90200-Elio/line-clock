<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>預約小幫手（示範）— 小事系統 Demo</title>
<meta name="theme-color" content="#f5efe5">
<style>
  :root {
    --brown:#8a5a2b; --brown-deep:#6e4620; --brown-soft:#b08a5d;
    --bg:#f5efe5; --card:#fff; --line:#ece2d2;
    --ink:#3a332c; --ink-soft:#8a8073; --ink-faint:#b3a896;
    --ok:#2e7d32; --ease: cubic-bezier(.32,.72,0,1);
    --shadow:0 1px 2px rgba(110,70,32,.04), 0 10px 26px -14px rgba(110,70,32,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(135% 75% at 50% -12%, #fdfaf4 0%, #f6f0e6 55%, #f1e8d9 100%) fixed;
    color: var(--ink); line-height: 1.55; min-height: 100dvh;
  }
  .app { max-width: 960px; margin: 0 auto; padding: 16px; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .anim { animation: rise .55s var(--ease) backwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .19s; } .d4 { animation-delay: .26s; }
  @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }

  .demo-banner {
    max-width: 960px; margin: 0 auto; padding: 9px 16px;
    background: linear-gradient(135deg, rgba(138,90,43,.12), rgba(138,90,43,.04));
    border-bottom: 1px solid rgba(138,90,43,.2);
    font-size: 12.5px; color: var(--brown); text-align: center; letter-spacing: .3px;
  }
  .demo-banner b { color: var(--brown-deep); }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 4px 16px; flex-wrap: wrap; }
  h1.title { font-size: 22px; color: var(--brown-deep); font-weight: 800; letter-spacing: .3px; }
  .date-label { font-size: 14px; color: var(--ink); margin-top: 4px; }
  .date-label .sub { color: var(--ink-soft); font-size: 12px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    padding: 8px 12px; font-size: 14px; border-radius: 11px; cursor: pointer;
    box-shadow: var(--shadow); transition: transform .18s var(--ease), background .18s;
  }
  .icon-btn:active { background: #fdf7ee; transform: scale(.92); }
  .icon-btn:disabled { opacity: .5; cursor: wait; }
  .icon-btn.loading .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  section { margin-bottom: 22px; }
  h2 { font-size: 15px; color: var(--brown-deep); margin-bottom: 12px; padding-left: 10px;
    border-left: 3px solid var(--brown); font-weight: 800; letter-spacing: .5px; }
  h2.warn { border-left-color: #d98a3d; }

  .card { background: var(--card); border-radius: 18px; padding: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); }

  .staff-box {
    background: #faf6ee; border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 14px; font-family: -apple-system, "SF Mono", "Menlo", monospace;
    font-size: 14px; color: var(--ink); white-space: pre-wrap; word-break: break-word;
    margin-bottom: 12px; min-height: 60px;
  }
  .primary-btn {
    background: linear-gradient(180deg, #96622f, #7c4f24); color: #fff; border: none; border-radius: 13px;
    padding: 13px 16px; font-size: 14.5px; font-weight: 700; letter-spacing: 1px; cursor: pointer; width: 100%;
    box-shadow: 0 10px 22px -10px rgba(124,79,36,.7);
    transition: transform .18s var(--ease), box-shadow .18s, opacity .18s;
  }
  .primary-btn:active { transform: scale(.985); }
  .primary-btn:disabled { background: #d8cebf; box-shadow: none; cursor: not-allowed; }
  .primary-btn.copied { background: linear-gradient(180deg, #5fb87c, #3f9a5f); }

  .reminder-list { display: flex; flex-direction: column; gap: 12px; }
  .reminder-card { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .reminder-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .reminder-head .owner { font-size: 16px; font-weight: 800; color: var(--brown-deep); letter-spacing: .3px; }
  .reminder-head .phone { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .reminder-head .phone a { color: var(--ink-soft); text-decoration: none; transition: color .15s; }
  .reminder-head .phone a:active { color: var(--brown); }
  .reminder-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .reminder-sub .cut { color: var(--brown); font-weight: 700; }
  .reminder-msg {
    background: #faf6ee; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 14px; white-space: pre-wrap; word-break: break-word;
    margin-bottom: 10px; color: var(--ink); line-height: 1.7;
  }
  .copy-btn { background: #fff; color: var(--brown-deep); border: 1.5px solid var(--line); border-radius: 11px;
    padding: 9px 15px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .18s var(--ease), background .18s, border-color .18s, color .18s; }
  .copy-btn:active { transform: scale(.96); }
  .copy-btn.copied { background: #edf6ee; border-color: #aedab9; color: var(--ok); }

  .missing-card { background: #fdf3e6; border: 1px solid #f0d9b8; border-radius: 14px; padding: 13px 15px; margin-bottom: 10px; font-size: 14px; color: #9a6b32; }
  .missing-card strong { color: #b9772f; }
  .missing-card .reason { font-size: 12px; color: #b08a5d; margin-top: 3px; }

  .empty-state { text-align: center; padding: 30px; color: var(--ink-faint); font-size: 14px; }

  .cta {
    display:block; text-align:center; text-decoration:none;
    margin: 6px 0 8px; padding: 15px;
    background: linear-gradient(180deg, #96622f, #7c4f24); color:#fff; font-weight:800; letter-spacing:1px;
    border-radius:14px; box-shadow: 0 12px 26px -12px rgba(124,79,36,.7);
    transition: transform .18s var(--ease);
  }
  .cta:active { transform: scale(.985); }

  footer { padding: 20px 4px 26px; font-size: 11px; color: var(--ink-faint); text-align: center; }
</style>
</head>
<body>

<div class="demo-banner">🧪 這是 <b>示範預約小幫手</b>，內容皆為虛構假資料 ·「毛孩之家（示範店）」</div>

<div id="dashboard" class="app">
  <header class="anim">
    <div>
      <h1 class="title">📅 預約小幫手</h1>
      <div class="date-label" id="dateLabel">載入中…</div>
    </div>
    <div class="header-actions">
      <button id="refreshBtn" class="icon-btn" title="重新整理">
        <span class="spin">🔄</span>
      </button>
    </div>
  </header>

  <section class="anim d1">
    <h2>📋 員工清單（貼到員工群組）</h2>
    <div class="card">
      <div class="staff-box" id="staffContent">載入中…</div>
      <button id="copyStaffBtn" class="primary-btn" disabled>📋 複製全部</button>
    </div>
  </section>

  <section id="remindersSection" class="anim d2">
    <h2>💬 客戶提醒草稿（逐筆貼給客戶）</h2>
    <div class="reminder-list" id="remindersList">
      <div class="empty-state">載入中…</div>
    </div>
  </section>

  <section id="missingSection" class="anim d3" hidden>
    <h2 class="warn">⚠️ 需要手動通知（查無主人）</h2>
    <div id="missingList"></div>
  </section>

  <a class="cta anim d4" href="intro.html">想幫自己的店裝一套？看完整介紹 →</a>

  <footer>🧪 示範用假資料 · 正式版每天早上自動整理隔天預約，複製貼上兩次就搞定</footer>
</div>

<script>
// ===== Demo：完全離線、假資料，不連任何後端 =====
function buildDemo() {
  const staffSummary =
    "📅 6/14（日）預約 5 件\n" +
    "─────────────\n" +
    "10:00  豆豆（貴賓）全身大美容 ✂️  — 小美\n" +
    "11:30  Lucky（柴犬）洗澡+剪毛 ✂️ — 阿哲\n" +
    "13:00  麻糬（馬爾濟斯）SPA 藥浴   — Nina\n" +
    "14:30  球球（柯基）基礎清潔洗澡   — Coco\n" +
    "16:00  奶茶（米克斯）剃毛造型 ✂️  — 小美";

  const reminders = [
    {
      ownerName: "王小姐", phone: "0912345321", petName: "豆豆", time: "10:00",
      isHaircut: true,
      message: "王小姐您好🐾 提醒您豆豆明天 6/14（日）10:00 預約全身大美容～\n請記得帶牽繩，當天若需調整時間再跟我們說喔！— 毛孩之家"
    },
    {
      ownerName: "陳先生", phone: "0933000118", petName: "Lucky", time: "11:30",
      isHaircut: true,
      message: "陳先生您好🐾 Lucky 明天 6/14（日）11:30 預約洗澡+剪毛，期待見到牠～\n如需取消請提前告知，謝謝！— 毛孩之家"
    },
    {
      ownerName: "林小姐", phone: "0922000540", petName: "麻糬", time: "13:00",
      isHaircut: false,
      message: "林小姐您好🐾 麻糬明天 6/14（日）13:00 預約 SPA 藥浴，記得讓牠先別吃太飽喔！— 毛孩之家"
    },
    {
      ownerName: "黃太太", phone: "0987000203", petName: "球球", time: "14:30",
      isHaircut: false,
      message: "黃太太您好🐾 球球明天 6/14（日）14:30 預約基礎清潔洗澡，到店再麻煩按門鈴～ — 毛孩之家"
    }
  ];

  const missingPhone = [
    { petName: "奶茶", time: "16:00", service: "剃毛造型", isHaircut: true,
      reason: "預約系統查無主人電話，需手動聯絡", phone: "" }
  ];

  return {
    dayWord: "明天", dateLabel: "6/14", weekday: "日", totalCount: 5,
    staffSummary, reminders, missingPhone
  };
}

// ===== DOM =====
const refreshBtn = document.getElementById("refreshBtn");
const dateLabel = document.getElementById("dateLabel");
const staffContent = document.getElementById("staffContent");
const copyStaffBtn = document.getElementById("copyStaffBtn");
const remindersList = document.getElementById("remindersList");
const missingSection = document.getElementById("missingSection");
const missingList = document.getElementById("missingList");
let currentData = null;

loadData();
refreshBtn.addEventListener("click", loadData);
copyStaffBtn.addEventListener("click", copyStaff);

function loadData() {
  refreshBtn.classList.add("loading");
  refreshBtn.disabled = true;
  setTimeout(() => {
    renderAll(buildDemo());
    refreshBtn.classList.remove("loading");
    refreshBtn.disabled = false;
  }, 260);
}

function renderAll(d) {
  currentData = d;
  dateLabel.innerHTML = `<strong>${escapeHtml(d.dayWord)} ${escapeHtml(d.dateLabel)} (${escapeHtml(d.weekday)})</strong> · <span class="sub">${d.totalCount} 件預約</span>`;
  staffContent.textContent = d.staffSummary || "(無)";
  copyStaffBtn.disabled = !d.staffSummary || d.totalCount === 0;
  copyStaffBtn.classList.remove("copied");
  copyStaffBtn.textContent = "📋 複製全部";

  if (!d.reminders || d.reminders.length === 0) {
    remindersList.innerHTML = `<div class="empty-state">${d.totalCount === 0 ? "明天無預約 🌿" : "（沒有可自動提醒的客戶）"}</div>`;
  } else {
    remindersList.innerHTML = d.reminders.map(renderReminderCard).join("");
    bindCopyButtons();
  }

  if (d.missingPhone && d.missingPhone.length > 0) {
    missingSection.hidden = false;
    missingList.innerHTML = d.missingPhone.map(renderMissingCard).join("");
  } else {
    missingSection.hidden = true;
    missingList.innerHTML = "";
  }
}

function renderReminderCard(r) {
  const cutTag = r.isHaircut ? ' · <span class="cut">剪毛 ✂️</span>' : " · 洗澡";
  return `
    <div class="reminder-card">
      <div class="reminder-head">
        <div class="owner">${escapeHtml(r.ownerName)}</div>
        <div class="phone"><a href="tel:${escapeHtml(r.phone)}">📞 ${escapeHtml(formatPhone(r.phone))}</a></div>
      </div>
      <div class="reminder-sub">${escapeHtml(r.petName)} · ${escapeHtml(r.time)}${cutTag}</div>
      <div class="reminder-msg">${escapeHtml(r.message)}</div>
      <button class="copy-btn" data-text="${escapeAttr(r.message)}">📋 複製此則</button>
    </div>`;
}

function renderMissingCard(m) {
  const cut = m.isHaircut ? " ✂️" : "";
  return `
    <div class="missing-card">
      <strong>${escapeHtml(m.petName)}${cut}</strong> · ${escapeHtml(m.time)} · ${escapeHtml(m.service)}
      <div class="reason">${escapeHtml(m.reason)}${m.phone ? `（描述欄電話：${escapeHtml(m.phone)}）` : ""}</div>
    </div>`;
}

function bindCopyButtons() {
  document.querySelectorAll(".copy-btn").forEach((btn) => {
    btn.addEventListener("click", () => copyToClipboard(btn.dataset.text, btn, "📋 複製此則"));
  });
}
function copyStaff() {
  if (!currentData || !currentData.staffSummary) return;
  copyToClipboard(currentData.staffSummary, copyStaffBtn, "📋 複製全部");
}
async function copyToClipboard(text, btn, originalLabel) {
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add("copied");
    btn.textContent = "✅ 已複製，去貼上吧";
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = originalLabel; }, 1800);
  } catch (err) { alert("複製失敗（請手動選取）：" + err.message); }
}
function formatPhone(p) { if (!p || p.length !== 10) return p || ""; return `${p.slice(0, 4)}-${p.slice(4, 7)}-${p.slice(7)}`; }
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/\n/g, "&#10;"); }
</script>
</body>
</html>
