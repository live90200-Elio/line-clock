<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>預約小幫手 — 寵美</title>
<meta name="theme-color" content="#0b1220">
<style>
  :root { --ease: cubic-bezier(.32,.72,0,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(232,208,122,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(122,178,232,.08), transparent 55%),
      linear-gradient(165deg, #0b1220 0%, #121b2e 55%, #0d1424 100%);
    background-attachment: fixed;
    color: #e8ecf5; line-height: 1.55;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .app { max-width: 960px; margin: 0 auto; padding: 14px 16px 8px; }

  /* 進場動畫 */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .anim { animation: rise .55s var(--ease) backwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; } .d3 { animation-delay: .19s; } .d4 { animation-delay: .26s; }
  @media (prefers-reduced-motion: reduce) { .anim { animation: none; opacity: 1; } }

  /* ===== 登入畫面 ===== */
  .login { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card {
    background: linear-gradient(170deg, rgba(36,48,72,.85), rgba(22,31,50,.95));
    border: 1px solid rgba(232,208,122,.25); border-radius: 20px; padding: 36px 30px;
    width: 100%; max-width: 360px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
    backdrop-filter: blur(8px); text-align: center;
  }
  .login .paw { font-size: 40px; }
  .login h1 { font-size: 21px; margin: 10px 0 4px; color: #f3e2a3; letter-spacing: 1px; }
  .login .sub { font-size: 13px; color: #8a9aad; margin-bottom: 26px; }
  .login input {
    width: 100%; font-size: 17px; padding: 13px 16px; margin-bottom: 12px;
    border: 1px solid #31415e; border-radius: 12px; background: rgba(11,18,32,.8); color: #e8ecf5;
    outline: none; text-align: center; letter-spacing: 2px;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .login input:focus { border-color: #e8d07a; box-shadow: 0 0 0 3px rgba(232,208,122,.15); }
  .login button {
    width: 100%; padding: 13px; font-size: 16px; font-weight: 700; letter-spacing: 4px;
    background: linear-gradient(135deg, #f0db8e, #d4a547); color: #1a1408;
    border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(212,165,71,.35);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .login button:active { transform: scale(.98); }
  .login button:disabled { opacity: .5; cursor: wait; }
  .login .error { color: #ff8585; font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ===== 頂欄 ===== */
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 2px 14px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .logo {
    width: 40px; height: 40px; flex: none; border-radius: 12px;
    background: linear-gradient(135deg, #f0db8e, #d4a547);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    box-shadow: 0 4px 12px rgba(212,165,71,.35);
  }
  h1.title { font-size: 17px; color: #f3e2a3; letter-spacing: .5px; white-space: nowrap; }
  .date-label { font-size: 12.5px; color: #cdd8e8; margin-top: 1px; }
  .date-label .sub { color: #8a9aad; font-size: 12px; }
  .header-actions { display: flex; gap: 8px; flex: none; }
  .icon-btn {
    background: rgba(36,48,72,.7); border: 1px solid #31415e; color: #e8ecf5;
    width: 38px; height: 38px; font-size: 15px; border-radius: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s var(--ease), background .18s;
  }
  .icon-btn:active { background: #2c3a57; transform: scale(.92); }
  .icon-btn:disabled { opacity: .45; cursor: wait; }
  .icon-btn .spin { display: inline-block; }
  .icon-btn.loading .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  section { margin-bottom: 22px; }
  h2 {
    font-size: 14px; color: #cdd8e8; margin-bottom: 12px; padding-left: 10px;
    border-left: 3px solid #e8d07a; letter-spacing: 1px;
  }
  h2.warn { border-left-color: #ff9a5c; }

  .card {
    background: linear-gradient(170deg, rgba(30,40,62,.9), rgba(19,27,44,.95));
    border-radius: 16px; padding: 16px; border: 1px solid #28344f;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }

  /* 員工清單區塊 */
  .staff-box {
    background: rgba(11,18,32,.7); border: 1px solid #28344f; border-radius: 12px;
    padding: 13px 14px; font-family: -apple-system, "SF Mono", "Menlo", monospace;
    font-size: 14px; color: #e8ecf5; white-space: pre-wrap; word-break: break-word;
    margin-bottom: 12px; min-height: 60px;
  }
  .primary-btn {
    background: linear-gradient(135deg, #f0db8e, #d4a547); color: #1a1408;
    border: none; border-radius: 12px; padding: 12px 16px;
    font-size: 14.5px; font-weight: 700; letter-spacing: 1px; cursor: pointer; width: 100%;
    box-shadow: 0 6px 16px rgba(212,165,71,.3);
    transition: transform .18s var(--ease), box-shadow .18s, opacity .18s;
  }
  .primary-btn:active { transform: scale(.985); }
  .primary-btn:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; filter: grayscale(.4); }
  .primary-btn.copied { background: linear-gradient(135deg, #b6e6c6, #7fce9c); }

  /* 客戶提醒卡片 */
  .reminder-list { display: flex; flex-direction: column; gap: 12px; }
  .reminder-card {
    background: linear-gradient(170deg, rgba(30,40,62,.9), rgba(19,27,44,.95));
    border-radius: 16px; padding: 15px; border: 1px solid #28344f;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .reminder-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 8px; margin-bottom: 4px;
  }
  .reminder-head .owner { font-size: 16px; font-weight: 800; color: #f3e2a3; letter-spacing: .3px; }
  .reminder-head .phone { font-size: 13px; color: #8a9aad; font-variant-numeric: tabular-nums; }
  .reminder-head .phone a { color: #8a9aad; text-decoration: none; transition: color .15s; }
  .reminder-head .phone a:active { color: #f3e2a3; }
  .reminder-sub { font-size: 13px; color: #8a9aad; margin-bottom: 10px; }
  .reminder-sub .cut { color: #f3e2a3; }
  .reminder-msg {
    background: rgba(11,18,32,.7); border: 1px solid #28344f; border-radius: 12px;
    padding: 11px 13px; font-size: 14px; white-space: pre-wrap; word-break: break-word;
    margin-bottom: 10px; color: #e8ecf5; line-height: 1.7;
  }
  .copy-btn {
    background: rgba(45,59,82,.5); color: #cdd8e8; border: 1px solid #31415e;
    border-radius: 11px; padding: 9px 15px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .18s var(--ease), background .18s, border-color .18s, color .18s;
  }
  .copy-btn:active { transform: scale(.96); }
  .copy-btn.copied { background: rgba(82,180,120,.18); border-color: #3d7a56; color: #9fe3b4; }

  /* 未處理清單（紅橘警告） */
  .missing-card {
    background: linear-gradient(170deg, rgba(58,40,24,.85), rgba(42,28,16,.9));
    border: 1px solid #5a3f28; border-radius: 14px;
    padding: 13px 15px; margin-bottom: 10px; font-size: 14px; color: #ffcfa0;
    box-shadow: 0 6px 16px rgba(0,0,0,.22);
  }
  .missing-card strong { color: #ffb366; }
  .missing-card .reason { font-size: 12px; color: #c99874; margin-top: 3px; }

  /* 空狀態 + 錯誤 */
  .empty-state { text-align: center; padding: 30px; color: #6a7a8d; font-size: 14px; }
  .error-box {
    background: rgba(80,30,30,.5); border: 1px solid #6b2a2a; color: #ffb8b8;
    padding: 12px; border-radius: 12px; font-size: 13px; margin-bottom: 16px;
  }

  footer { padding: 20px 4px 26px; font-size: 11px; color: #4a5a6d; text-align: center; }
</style>
</head>
<body>

<!-- ===== 登入畫面 ===== -->
<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="paw">📅</div>
    <h1>預約小幫手</h1>
    <div class="sub">輸入密碼進入</div>
    <input type="password" id="keyInput" placeholder="密碼" autocomplete="off">
    <button id="loginBtn">進入</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- ===== 主畫面 ===== -->
<div id="dashboard" class="app" hidden>
  <header class="anim">
    <div class="brand">
      <div class="logo">📅</div>
      <div>
        <h1 class="title">預約小幫手</h1>
        <div class="date-label" id="dateLabel">載入中…</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="refreshBtn" class="icon-btn" title="重新整理">
        <span class="spin">🔄</span>
      </button>
      <button id="logoutBtn" class="icon-btn" title="登出">🚪</button>
    </div>
  </header>

  <div id="errorBox"></div>

  <section class="anim d1">
    <h2>📋 員工清單（貼到員工群組）</h2>
    <div class="card">
      <div class="staff-box" id="staffContent">載入中…</div>
      <button id="copyStaffBtn" class="primary-btn" disabled>📋 複製全部</button>
    </div>
  </section>

  <section id="remindersSection" class="anim d2">
    <h2>💬 客戶提醒草稿（逐筆貼給客戶）</h2>
    <div class="reminder-list" id="remindersList">
      <div class="empty-state">載入中…</div>
    </div>
  </section>

  <section id="missingSection" class="anim d3" hidden>
    <h2 class="warn">⚠️ 需要手動通知（查無主人）</h2>
    <div id="missingList"></div>
  </section>

  <footer>🐾 每天早上來看明天的預約，複製貼上兩次就搞定</footer>
</div>

<script>
// ===== 設定 =====
// Apps Script 部署後拿到的 /exec 網址：
const APPT_API_URL = "https://script.google.com/macros/s/AKfycbwhpwRwRpWdhk4KhdLM-P5_8yCRo7ukL0UktWvZAu16OyqJhC-XMdKzfqPN-UqY_z9wPQ/exec";

const STORAGE_KEY = "appointment-helper-key";

// ===== DOM =====
const loginScreen = document.getElementById("loginScreen");
const dashboard = document.getElementById("dashboard");
const keyInput = document.getElementById("keyInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const refreshBtn = document.getElementById("refreshBtn");
const logoutBtn = document.getElementById("logoutBtn");
const errorBox = document.getElementById("errorBox");
const dateLabel = document.getElementById("dateLabel");
const staffContent = document.getElementById("staffContent");
const copyStaffBtn = document.getElementById("copyStaffBtn");
const remindersList = document.getElementById("remindersList");
const missingSection = document.getElementById("missingSection");
const missingList = document.getElementById("missingList");

// ===== 狀態 =====
let currentKey = localStorage.getItem(STORAGE_KEY) || "";
let currentData = null;

// ===== 啟動 =====
if (currentKey) enterDashboard();
else showLogin();

// ===== 登入 =====
function showLogin() {
  loginScreen.hidden = false;
  dashboard.hidden = true;
  keyInput.focus();
}

async function attemptLogin() {
  const k = keyInput.value.trim();
  if (!k) return;
  loginBtn.disabled = true;
  loginError.textContent = "";
  try {
    const res = await fetchData(k);
    if (res.error) {
      loginError.textContent = res.error === "auth_failed" ? "密碼錯誤" : res.error;
      loginBtn.disabled = false;
      return;
    }
    currentKey = k;
    localStorage.setItem(STORAGE_KEY, k);
    enterDashboard(res);
  } catch (err) {
    loginError.textContent = "連線失敗：" + err.message;
    loginBtn.disabled = false;
  }
}

loginBtn.addEventListener("click", attemptLogin);
keyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });

function enterDashboard(preloaded) {
  loginScreen.hidden = true;
  dashboard.hidden = false;
  if (preloaded) renderAll(preloaded);
  else loadData();
}

function logout() {
  localStorage.removeItem(STORAGE_KEY);
  currentKey = "";
  keyInput.value = "";
  loginBtn.disabled = false;
  loginError.textContent = "";
  showLogin();
}
logoutBtn.addEventListener("click", logout);
refreshBtn.addEventListener("click", loadData);
copyStaffBtn.addEventListener("click", copyStaff);

async function loadData() {
  refreshBtn.classList.add("loading");
  refreshBtn.disabled = true;
  errorBox.innerHTML = "";
  try {
    const data = await fetchData(currentKey);
    if (data.error) {
      if (data.error === "auth_failed") { logout(); return; }
      throw new Error(data.error);
    }
    renderAll(data);
  } catch (err) {
    errorBox.innerHTML = `<div class="error-box">⚠️ 讀取失敗：${escapeHtml(err.message)}</div>`;
  } finally {
    refreshBtn.classList.remove("loading");
    refreshBtn.disabled = false;
  }
}

async function fetchData(key) {
  if (!APPT_API_URL) {
    throw new Error("尚未設定 APPT_API_URL，請先部署 Apps Script 並把網址貼進 index.html");
  }
  const url = `${APPT_API_URL}?key=${encodeURIComponent(key)}`;
  const res = await fetch(url, { redirect: "follow" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ===== 渲染 =====
function renderAll(d) {
  currentData = d;

  const dw = d.dayWord || "明天";
  dateLabel.innerHTML = `<strong>${escapeHtml(dw)} ${escapeHtml(d.dateLabel)} (${escapeHtml(d.weekday)})</strong> · <span class="sub">${d.totalCount} 件預約</span>`;

  // 員工清單
  staffContent.textContent = d.staffSummary || "(無)";
  copyStaffBtn.disabled = !d.staffSummary || d.totalCount === 0;
  copyStaffBtn.classList.remove("copied");
  copyStaffBtn.textContent = "📋 複製全部";

  // 客戶提醒
  if (!d.reminders || d.reminders.length === 0) {
    remindersList.innerHTML = `<div class="empty-state">${d.totalCount === 0 ? "明天無預約 🌿" : "（沒有可自動提醒的客戶 — 請看下方手動處理區）"}</div>`;
  } else {
    remindersList.innerHTML = d.reminders.map(renderReminderCard).join("");
    bindCopyButtons();
  }

  // 未處理
  if (d.missingPhone && d.missingPhone.length > 0) {
    missingSection.hidden = false;
    missingList.innerHTML = d.missingPhone.map(renderMissingCard).join("");
  } else {
    missingSection.hidden = true;
    missingList.innerHTML = "";
  }
}

function renderReminderCard(r) {
  const cutTag = r.isHaircut ? ' · <span class="cut">剪毛 ✂️</span>' : " · 洗澡";
  const phoneDigits = r.phone;
  const phoneDisplay = formatPhone(r.phone);
  return `
    <div class="reminder-card">
      <div class="reminder-head">
        <div class="owner">${escapeHtml(r.ownerName)}</div>
        <div class="phone"><a href="tel:${escapeHtml(phoneDigits)}">📞 ${escapeHtml(phoneDisplay)}</a></div>
      </div>
      <div class="reminder-sub">${escapeHtml(r.petName)} · ${escapeHtml(r.time)}${cutTag}</div>
      <div class="reminder-msg">${escapeHtml(r.message)}</div>
      <button class="copy-btn" data-text="${escapeAttr(r.message)}">📋 複製此則</button>
    </div>`;
}

function renderMissingCard(m) {
  const cut = m.isHaircut ? " ✂️" : "";
  return `
    <div class="missing-card">
      <strong>${escapeHtml(m.petName)}${cut}</strong> · ${escapeHtml(m.time)} · ${escapeHtml(m.service)}
      <div class="reason">${escapeHtml(m.reason)}${m.phone ? `（描述欄電話：${escapeHtml(m.phone)}）` : ""}</div>
    </div>`;
}

function bindCopyButtons() {
  document.querySelectorAll(".copy-btn").forEach((btn) => {
    btn.addEventListener("click", () => copyToClipboard(btn.dataset.text, btn, "📋 複製此則"));
  });
}

function copyStaff() {
  if (!currentData || !currentData.staffSummary) return;
  copyToClipboard(currentData.staffSummary, copyStaffBtn, "📋 複製全部");
}

async function copyToClipboard(text, btn, originalLabel) {
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add("copied");
    btn.textContent = "✅ 已複製，去貼上吧";
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.textContent = originalLabel;
    }, 1800);
  } catch (err) {
    alert("複製失敗（請手動選取）：" + err.message);
  }
}

// ===== 工具 =====
function formatPhone(p) {
  if (!p || p.length !== 10) return p || "";
  return `${p.slice(0, 4)}-${p.slice(4, 7)}-${p.slice(7)}`;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/\n/g, "&#10;");
}
</script>
</body>
</html>
