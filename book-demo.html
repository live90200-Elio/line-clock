<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>線上預約</title>
<style>
  :root { --brown:#8a5a2b; --brown-deep:#6e4620; --bg:#f7f3ec; --card:#fff; --line:#e5dccd; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:"Microsoft JhengHei","Noto Sans CJK TC",sans-serif; background:var(--bg); color:#333; line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 60px; }
  h1 { font-size:1.35rem; text-align:center; color:var(--brown-deep); margin:8px 0 2px; }
  .sub { text-align:center; color:#998; font-size:.85rem; margin-bottom:18px; }
  .card { background:var(--card); border-radius:16px; padding:18px 16px; margin-bottom:16px; box-shadow:0 2px 12px rgba(0,0,0,.05); }
  .card h2 { font-size:1rem; color:var(--brown); margin:0 0 12px; border-bottom:2px solid var(--line); padding-bottom:6px; }
  label { display:block; font-size:.88rem; color:#666; margin:10px 0 4px; }
  input[type=text], input[type=tel], input[type=date], select { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:1rem; background:#fff; color:#333; }
  .svc { display:flex; gap:10px; }
  .svc .opt { flex:1; border:2px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center; cursor:pointer; transition:.15s; }
  .svc .opt.on { border-color:var(--brown); background:#fdf8f0; }
  .svc .opt .ic { font-size:1.6rem; }
  .svc .opt .nm { font-weight:700; color:var(--brown-deep); margin-top:2px; }
  .submit { width:100%; padding:15px; margin-top:8px; border:none; border-radius:12px; background:var(--brown); color:#fff; font-size:1.1rem; font-weight:700; }
  .submit:disabled { background:#ccc; }
  .msg { text-align:center; padding:14px; border-radius:10px; margin-top:12px; font-size:.92rem; display:none; }
  .msg.err { background:#fdecec; color:#c0392b; display:block; }
  .done { text-align:center; padding:40px 20px; }
  .done .big { font-size:3rem; }
  .done h2 { color:var(--brown-deep); border:none; }
  .done .info { background:#fdf8f0; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:16px 0; text-align:left; font-size:.95rem; }
  .done .info b { color:var(--brown-deep); }
</style>
</head>
<body>
<div class="wrap">
  <div id="form">
    <h1>🐾 線上預約</h1>
    <div class="sub">毛孩之家（示範店）<br>填好資料送出，預約就會進入我們的日曆</div>

    <div class="card">
      <h2>① 選擇服務</h2>
      <div class="svc" id="svc">
        <div class="opt on" data-svc="wash"><div class="ic">🛁</div><div class="nm">洗澡</div></div>
        <div class="opt" data-svc="cut"><div class="ic">✂️</div><div class="nm">剪毛</div></div>
      </div>
    </div>

    <div class="card">
      <h2>② 預約資料</h2>
      <label>寵物名 *</label><input type="text" id="petName" placeholder="例：黑寶">
      <label>聯絡電話 *</label><input type="tel" id="phone" placeholder="09xxxxxxxx">
      <label>日期 *</label><input type="date" id="date">
      <label>時段 *</label>
      <select id="time"></select>
      <label>備註（選填）</label><input type="text" id="note" placeholder="例：怕剪指甲、要剃毛">
    </div>

    <button class="submit" id="submit">確認預約</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="result" style="display:none;">
    <div class="done">
      <div class="big">✅</div>
      <h2>預約成功！</h2>
      <div class="info" id="info"></div>
      <p style="color:#998;font-size:.85rem;">已寫進店家的 Google 日曆，到時會提醒您 🙌</p>
    </div>
  </div>
</div>

<script>
// ⚠️ 部署後填：Demo 預約日曆 GAS Web App 的 /exec 網址
const API_URL = "https://script.google.com/macros/s/AKfycbxjHMj7QGzavs1UD33ObVqDM0KdSMDOp18p5L1ABH1thpu-zcQ8shY86b8Vzekqmt2o/exec";

const $ = (id) => document.getElementById(id);
let svc = "wash";

// 服務選擇
document.querySelectorAll("#svc .opt").forEach(el => el.addEventListener("click", () => {
  svc = el.dataset.svc;
  document.querySelectorAll("#svc .opt").forEach(o => o.classList.toggle("on", o.dataset.svc === svc));
}));

// 日期：預設明天、最小今天
(function initDate() {
  const pad = (n) => String(n).padStart(2, "0");
  const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const today = new Date();
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  $("date").min = fmt(today);
  $("date").value = fmt(tmr);
})();

// 時段：09:00～19:30，每 30 分一格
(function initTimes() {
  const sel = $("time");
  for (let h = 9; h < 20; h++) {
    for (const m of ["00", "30"]) {
      const v = String(h).padStart(2, "0") + ":" + m;
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    }
  }
  sel.value = "14:00";
})();

// 送出
$("submit").addEventListener("click", async () => {
  const msg = $("msg"); msg.className = "msg"; msg.style.display = "none";
  const fail = (t) => { msg.textContent = t; msg.className = "msg err"; };

  const petName = $("petName").value.trim();
  const phone = $("phone").value.trim();
  if (!petName) return fail("請填寵物名");
  if (!/^09\d{8}$/.test(phone.replace(/\D/g, ""))) return fail("電話格式錯誤（09 開頭 10 碼）");
  if (!$("date").value) return fail("請選日期");

  const btn = $("submit"); btn.disabled = true; btn.textContent = "預約中…";
  const data = {
    petName, phone, service: svc,
    date: $("date").value, time: $("time").value,
    note: $("note").value.trim(),
  };
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
    const out = await res.json();
    if (out.ok) {
      $("info").innerHTML =
        `🐾 <b>${out.petName}</b>　${out.service}<br>🗓️ ${out.whenLabel}`;
      $("form").style.display = "none";
      $("result").style.display = "block";
      window.scrollTo(0, 0);
    } else {
      fail("預約失敗：" + (out.message || "未知錯誤"));
      btn.disabled = false; btn.textContent = "確認預約";
    }
  } catch (err) {
    fail("連線失敗，請稍後再試");
    btn.disabled = false; btn.textContent = "確認預約";
  }
});
</script>
</body>
</html>
